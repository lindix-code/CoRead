<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CoRead</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>CoRead</h1>
    <nav id="nav" hidden>
      <button id="tab-home" class="tab active">Start</button>
      <button id="tab-search" class="tab">Suche</button>
      <button id="tab-library" class="tab">Bibliothek</button>
      <button id="tab-feed" class="tab">Pinnwand</button>
      <button id="tab-friend" class="tab">Freundin</button>
    </nav>
    <button id="logout" class="tab" hidden>Abmelden</button>
  </header>

  <main>
    <!-- Login / Registrierung -->
    <section id="view-auth">
      <form id="auth-form" class="stack">
        <h2>Anmelden</h2>
        <input id="auth-name" type="text" placeholder="Dein Name (nur bei Registrierung)" autocomplete="nickname">
        <input id="auth-email" type="email" placeholder="E-Mail" autocomplete="email" required>
        <input id="auth-password" type="password" placeholder="Passwort (mind. 8 Zeichen)" minlength="8" autocomplete="current-password" required>
        <div class="actions">
          <button type="submit" id="btn-login">Anmelden</button>
          <button type="button" id="btn-signup" class="btn secondary">Registrieren</button>
        </div>
        <p id="auth-status" role="status"></p>
      </form>
    </section>

    <!-- Startseite -->
    <section id="view-home" hidden>
      <div id="home-hero"></div>
      <div class="tiles">
        <button id="tile-shelf" class="tile" type="button">
          <span class="tile-label">Mein Bücherregal</span>
          <span class="tile-number" id="shelf-count">0</span>
        </button>
        <button id="tile-stack" class="tile" type="button">
          <span class="tile-label">Stapel ungelesener Bücher</span>
          <span class="tile-number" id="stack-count">0</span>
        </button>
        <button id="tile-year" class="tile" type="button">
          <span class="tile-label" id="year-label">Gelesen</span>
          <span class="tile-number" id="year-count">0</span>
        </button>
      </div>
      <div id="year-overview" class="overview" hidden></div>
    </section>

    <!-- Suche -->
    <section id="view-search" hidden>
      <form id="search-form">
        <input id="query" type="search" placeholder="Titel, Autor:in oder ISBN" autocomplete="off" required>
        <select id="lang" aria-label="Sprache">
          <option value="de" selected>Deutsch</option>
          <option value="">Alle Sprachen</option>
        </select>
        <button type="submit">Suchen</button>
      </form>
      <p id="status" role="status"></p>
      <div id="results" class="grid"></div>
    </section>

    <!-- Bibliothek -->
    <section id="view-library" hidden>
      <div class="actions switch">
        <button id="lib-mine" class="btn" type="button">Meine</button>
        <button id="lib-friend" class="btn secondary" type="button" hidden></button>
      </div>
      <div class="lib-toolbar">
        <input id="lib-search" class="lib-search" type="search" placeholder="Bibliothek durchsuchen" autocomplete="off">
        <button id="lib-add" class="btn add-btn" type="button" aria-label="Buch hinzufügen" title="Buch hinzufügen">+</button>
      </div>
      <label class="sort-row">Sortieren:
        <select id="lib-sort">
          <option value="added" selected>Zuletzt hinzugefügt</option>
          <option value="title">Titel (A–Z)</option>
          <option value="author">Autor:in (A–Z)</option>
          <option value="rating">Bewertung (beste zuerst)</option>
        </select>
      </label>
      <div id="lib-lists" class="actions subtabs"></div>
      <p id="library-status" role="status"></p>
      <div id="library" class="grid"></div>
    </section>

    <!-- Pinnwand -->
    <section id="view-feed" hidden>
      <div class="feed-top">
        <h2>Pinnwand</h2>
        <button id="post-new" class="btn" type="button">+ Neuer Eintrag</button>
      </div>
      <p id="feed-status" role="status"></p>
      <div id="feed"></div>
      <button id="feed-more" class="btn secondary" type="button" hidden>Ältere Einträge laden</button>
    </section>

    <!-- Verbindung mit der Freundin -->
    <section id="view-friend" hidden>
      <div class="stack">
        <h2>Deine Verbindung</h2>
        <p id="friend-info"></p>
        <p>Dein Einladungscode: <strong id="my-code" class="code"></strong></p>
        <form id="connect-form" class="stack">
          <input id="friend-code" type="text" placeholder="Code deiner Freundin" autocomplete="off" required>
          <button type="submit">Verbinden</button>
        </form>
        <p id="friend-status" role="status"></p>
      </div>
    </section>
  </main>

  <dialog id="finish-dialog">
    <button id="finish-close" class="close" aria-label="Schließen">×</button>
    <h2>Buch abgeschlossen</h2>
    <div id="finish-book" class="post-book"></div>
    <p class="finish-q">Wie hat dir das Buch gefallen?</p>
    <div id="finish-stars" class="stars" role="group" aria-label="Sterne"></div>

    <div id="finish-choice" class="finish-choice">
      <p class="finish-q">Möchtest du eine Bewertung schreiben?</p>
      <button id="finish-write" class="btn" type="button">Ja, Bewertung schreiben</button>
      <button id="finish-stars-only" class="btn secondary" type="button">Nein, nur Sterne vergeben</button>
      <button id="finish-skip" class="btn secondary" type="button">Überspringen</button>
    </div>

    <form id="finish-form" hidden>
      <input id="finish-headline" type="text" maxlength="120" placeholder="Überschrift (optional)" autocomplete="off">
      <textarea id="finish-text" rows="6" maxlength="5000" placeholder="Deine Bewertung …" required></textarea>
      <div class="actions">
        <button id="finish-photo-btn" class="btn secondary" type="button">Fotos hinzufügen</button>
        <input id="finish-photos" type="file" accept="image/*" multiple hidden>
      </div>
      <div id="finish-previews" class="previews"></div>
      <button id="finish-submit" type="submit">Pinnwand veröffentlichen</button>
      <button id="finish-back" class="btn secondary" type="button">Zurück</button>
    </form>
    <p id="finish-status" role="status"></p>
  </dialog>

  <dialog id="post-dialog">
    <button id="post-close" class="close" aria-label="Schließen">×</button>
    <h2>Neuer Eintrag</h2>
    <form id="post-form">
      <input id="post-title" type="text" maxlength="120" placeholder="Titel (optional)" autocomplete="off">
      <textarea id="post-body" rows="5" maxlength="5000" placeholder="Was gibt's Neues? Z. B. Buch abgeschlossen, neue Bücher bestellt …" required></textarea>
      <label class="field">Buch verknüpfen (optional)
        <select id="post-book"></select>
      </label>
      <div class="actions">
        <button id="post-photo-btn" class="btn secondary" type="button">Fotos hinzufügen</button>
        <input id="post-photos" type="file" accept="image/*" multiple hidden>
      </div>
      <div id="post-previews" class="previews"></div>
      <p id="post-status" role="status"></p>
      <button id="post-submit" type="submit">Veröffentlichen</button>
    </form>
  </dialog>

  <dialog id="edit-post-dialog">
    <button id="edit-post-close" class="close" aria-label="Schließen">×</button>
    <h2>Eintrag bearbeiten</h2>
    <form id="edit-post-form">
      <input id="edit-post-title" type="text" maxlength="120" placeholder="Titel (optional)" autocomplete="off">
      <textarea id="edit-post-body" rows="6" maxlength="5000" required></textarea>
      <div id="edit-post-stars-wrap" hidden>
        <div class="meta">Sterne</div>
        <div id="edit-post-stars" class="stars"></div>
      </div>
      <p id="edit-post-status" role="status"></p>
      <button id="edit-post-submit" type="submit">Speichern</button>
    </form>
  </dialog>

  <dialog id="add-dialog">
    <button id="add-close" class="close" aria-label="Schließen">×</button>
    <h2 id="add-title"></h2>
    <form id="add-form">
      <input id="add-query" type="search" placeholder="Titel, Autor:in oder ISBN" autocomplete="off" required>
      <select id="add-lang" aria-label="Sprache">
        <option value="de" selected>Deutsch</option>
        <option value="">Alle Sprachen</option>
      </select>
      <button type="submit">Suchen</button>
    </form>
    <p id="add-status" role="status"></p>
    <div id="add-results" class="grid"></div>
  </dialog>

  <dialog id="detail">
    <button id="close" class="close" aria-label="Schließen">×</button>
    <div id="detail-content"></div>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
