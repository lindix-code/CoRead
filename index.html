<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CoRead</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>CoRead</h1>
    <nav id="nav" hidden>
      <button id="tab-home" class="tab active">Start</button>
      <button id="tab-search" class="tab">Suche</button>
      <button id="tab-library" class="tab">Bibliothek</button>
      <button id="tab-friend" class="tab">Freundin</button>
    </nav>
    <button id="logout" class="tab" hidden>Abmelden</button>
  </header>

  <main>
    <!-- Login / Registrierung -->
    <section id="view-auth">
      <form id="auth-form" class="stack">
        <h2>Anmelden</h2>
        <input id="auth-name" type="text" placeholder="Dein Name (nur bei Registrierung)" autocomplete="nickname">
        <input id="auth-email" type="email" placeholder="E-Mail" autocomplete="email" required>
        <input id="auth-password" type="password" placeholder="Passwort (mind. 8 Zeichen)" minlength="8" autocomplete="current-password" required>
        <div class="actions">
          <button type="submit" id="btn-login">Anmelden</button>
          <button type="button" id="btn-signup" class="btn secondary">Registrieren</button>
        </div>
        <p id="auth-status" role="status"></p>
      </form>
    </section>

    <!-- Startseite -->
    <section id="view-home" hidden>
      <div id="home-hero"></div>
      <div class="tiles">
        <button id="tile-shelf" class="tile" type="button">
          <span class="tile-label">Mein Bücherregal</span>
          <span class="tile-number" id="shelf-count">0</span>
          <span class="tile-sub" id="shelf-sub"></span>
        </button>
        <button id="tile-year" class="tile" type="button">
          <span class="tile-label" id="year-label">Gelesen</span>
          <span class="tile-number" id="year-count">0</span>
          <span class="tile-sub">Bücher in diesem Jahr</span>
        </button>
      </div>
      <div id="year-overview" class="overview" hidden></div>
    </section>

    <!-- Suche -->
    <section id="view-search" hidden>
      <form id="search-form">
        <input id="query" type="search" placeholder="Titel, Autor:in oder ISBN" autocomplete="off" required>
        <select id="lang" aria-label="Sprache">
          <option value="de" selected>Deutsch</option>
          <option value="">Alle Sprachen</option>
        </select>
        <button type="submit">Suchen</button>
      </form>
      <p id="status" role="status"></p>
      <div id="results" class="grid"></div>
    </section>

    <!-- Bibliothek -->
    <section id="view-library" hidden>
      <div class="actions switch">
        <button id="lib-mine" class="btn" type="button">Meine</button>
        <button id="lib-friend" class="btn secondary" type="button" hidden></button>
      </div>
      <div id="lib-lists" class="actions subtabs"></div>
      <p id="library-status" role="status"></p>
      <div id="library" class="grid"></div>
    </section>

    <!-- Verbindung mit der Freundin -->
    <section id="view-friend" hidden>
      <div class="stack">
        <h2>Deine Verbindung</h2>
        <p id="friend-info"></p>
        <p>Dein Einladungscode: <strong id="my-code" class="code"></strong></p>
        <form id="connect-form" class="stack">
          <input id="friend-code" type="text" placeholder="Code deiner Freundin" autocomplete="off" required>
          <button type="submit">Verbinden</button>
        </form>
        <p id="friend-status" role="status"></p>
      </div>
    </section>
  </main>

  <dialog id="detail">
    <button id="close" class="close" aria-label="Schließen">×</button>
    <div id="detail-content"></div>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
